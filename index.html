<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Reaction Lab</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            margin: 0;
            background-color: #020617; /* Tailwind slate-950 */
            font-family: 'Inter', sans-serif;
        }

        @keyframes floatUp { 
            0% { transform: translateY(0) scale(1); opacity: 1; } 
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; } 
        }
        
        @keyframes pourFromRight {
            0% { transform: translate(0px, 0px) rotate(0deg); opacity: 1; }
            20% { transform: translate(-200px, -180px) rotate(-60deg); opacity: 1; }
            80% { transform: translate(-200px, -180px) rotate(-60deg); opacity: 1; }
            100% { transform: translate(-200px, -180px) rotate(-60deg); opacity: 0; }
        }
        
        .animate-pour-from-right {
            animation: pourFromRight 1.5s forwards ease-in-out;
        }

        .animate-pour-from-right .pour-inner .liquid-layer {
            animation: liquidDrop 1.5s forwards ease-in-out;
        }
        
        @keyframes liquidDrop {
            0% { height: 40%; }
            30% { height: 40%; }
            80% { height: 0%; }
            100% { height: 0%; }
        }
        
        @keyframes heatOutUp { 0% { transform: translateY(15px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(-25px); opacity: 0; } }
        @keyframes heatOutLeft { 0% { transform: translateX(15px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateX(-25px); opacity: 0; } }
        @keyframes heatOutRight { 0% { transform: translateX(-15px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateX(25px); opacity: 0; } }
        
        @keyframes heatInDown { 0% { transform: translateY(-25px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(15px); opacity: 0; } }
        @keyframes heatInRight { 0% { transform: translateX(-25px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateX(15px); opacity: 0; } }
        @keyframes heatInLeft { 0% { transform: translateX(25px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateX(-15px); opacity: 0; } }
        
        .animate-heat-out-up { animation: heatOutUp 1.2s ease-out infinite; }
        .animate-heat-out-left { animation: heatOutLeft 1.2s ease-out infinite; }
        .animate-heat-out-right { animation: heatOutRight 1.2s ease-out infinite; }
        .animate-heat-in-down { animation: heatInDown 1.2s ease-out infinite; }
        .animate-heat-in-right { animation: heatInRight 1.2s ease-out infinite; }
        .animate-heat-in-left { animation: heatInLeft 1.2s ease-out infinite; }
        
        /* Hide scrollbar for button row on mobile/iPad */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const EXPERIMENTS = [
            {
                id: 'exo_1',
                name: 'น้ำ + แคลเซียมคลอไรด์',
                type: 'exothermic',
                title: 'ปฏิกิริยาคายความร้อน (Exothermic)',
                description: 'เมื่อละลายแคลเซียมคลอไรด์ในน้ำ ระบบจะปล่อยความร้อนออกมาสู่สิ่งแวดล้อม ทำให้อุณหภูมิของสารละลายสูงขึ้น รู้สึกร้อนเมื่อสัมผัส',
                baseTemp: 25,
                targetTemp: 45,
                reactionTime: 4000,
                baseReactant: 'น้ำ (H₂O)',
                addedReactant: 'แคลเซียมคลอไรด์',
                baseColor: '#0cebeb',
                addedColor: '#f1f5f9',
                finalColor: '#fca5a5',
                particles: 'fire',
                equation: 'CaCl₂(s) + H₂O(l) → Ca²⁺(aq) + 2Cl⁻(aq) + ความร้อน',
                energyProfile: { reactants: 80, activation: 90, products: 30 }
            },
            {
                id: 'endo_1',
                name: 'น้ำ + แอมโมเนียมไนเตรต',
                type: 'endothermic',
                title: 'ปฏิกิริยาดูดความร้อน (Endothermic)',
                description: 'เมื่อละลายแอมโมเนียมไนเตรตในน้ำ ระบบจะดูดกลืนความร้อนจากสิ่งแวดล้อมเข้าไป ทำให้อุณหภูมิของสารละลายลดลง รู้สึกเย็นเมื่อสัมผัส',
                baseTemp: 25,
                targetTemp: 5,
                reactionTime: 4000,
                baseReactant: 'น้ำ (H₂O)',
                addedReactant: 'แอมโมเนียมไนเตรต',
                baseColor: '#0cebeb',
                addedColor: '#e2e8f0',
                finalColor: '#93c5fd',
                particles: 'snow',
                equation: 'NH₄NO₃(s) + H₂O(l) + ความร้อน → NH₄⁺(aq) + NO₃⁻(aq)',
                energyProfile: { reactants: 30, activation: 95, products: 80 }
            },
            {
                id: 'exo_2',
                name: 'กรด HCl + แมกนีเซียม',
                type: 'exothermic',
                title: 'ปฏิกิริยาคายความร้อน (Exothermic)',
                description: 'โลหะแมกนีเซียมทำปฏิกิริยากับกรด เกิดแก๊สไฮโดรเจนและปล่อยพลังงานความร้อนออกมา',
                baseTemp: 25,
                targetTemp: 55,
                reactionTime: 4500,
                baseReactant: 'กรดไฮโดรคลอริก',
                addedReactant: 'โลหะแมกนีเซียม',
                baseColor: '#cffafe',
                addedColor: '#94a3b8',
                finalColor: '#fcd34d',
                particles: 'bubbles',
                equation: 'Mg(s) + 2HCl(aq) → MgCl₂(aq) + H₂(g) + ความร้อน',
                energyProfile: { reactants: 75, activation: 85, products: 20 }
            },
            {
                id: 'endo_2',
                name: 'น้ำส้มสายชู + เบกกิ้งโซดา',
                type: 'endothermic',
                title: 'ปฏิกิริยาดูดความร้อน (Endothermic)',
                description: 'เมื่อผสมน้ำส้มสายชูกับเบกกิ้งโซดา จะเกิดแก๊สคาร์บอนไดออกไซด์ และระบบจะดูดกลืนความร้อนทำให้อุณหภูมิลดลง',
                baseTemp: 25,
                targetTemp: 16,
                reactionTime: 4000,
                baseReactant: 'น้ำส้มสายชู',
                addedReactant: 'เบกกิ้งโซดา',
                baseColor: '#fef08a', 
                addedColor: '#ffffff', 
                finalColor: '#bfdbfe', 
                particles: 'snow',
                equation: 'NaHCO₃(s) + CH₃COOH(aq) + ความร้อน → CH₃COONa(aq) + H₂O(l) + CO₂(g)',
                energyProfile: { reactants: 20, activation: 80, products: 60 }
            },
            {
                id: 'exo_3',
                name: 'กรด HCl + โซเดียมไฮดรอกไซด์',
                type: 'exothermic',
                title: 'ปฏิกิริยาคายความร้อน (Exothermic)',
                description: 'ปฏิกิริยาสะเทินระหว่างกรดและเบส เกิดเกลือและน้ำ ระบบจะปล่อยพลังงานความร้อนออกมาสู่สิ่งแวดล้อม',
                baseTemp: 25,
                targetTemp: 45,
                reactionTime: 3500,
                baseReactant: 'กรดไฮโดรคลอริก',
                addedReactant: 'โซเดียมไฮดรอกไซด์',
                baseColor: '#e0f2fe', 
                addedColor: '#f8fafc', 
                finalColor: '#fca5a5', 
                particles: 'fire',
                equation: 'HCl(aq) + NaOH(aq) → NaCl(aq) + H₂O(l) + ความร้อน',
                energyProfile: { reactants: 80, activation: 90, products: 25 }
            },
            {
                id: 'endo_3',
                name: 'น้ำ + โพแทสเซียมไนเตรต',
                type: 'endothermic',
                title: 'ปฏิกิริยาดูดความร้อน (Endothermic)',
                description: 'การละลายโพแทสเซียมไนเตรตในน้ำ ต้องการพลังงานในการแตกตัว ทำให้อุณหภูมิของสารละลายลดลง',
                baseTemp: 25,
                targetTemp: 12,
                reactionTime: 4500,
                baseReactant: 'น้ำ (H₂O)',
                addedReactant: 'โพแทสเซียมไนเตรต',
                baseColor: '#0cebeb', 
                addedColor: '#f1f5f9', 
                finalColor: '#93c5fd', 
                particles: 'snow',
                equation: 'KNO₃(s) + H₂O(l) + ความร้อน → K⁺(aq) + NO₃⁻(aq)',
                energyProfile: { reactants: 35, activation: 95, products: 80 }
            }
        ];

        const PARTICLES_DATA = [
            { left: '10%', bottom: '-10px', delay: '0s', duration: '1s', size: '4px' },
            { left: '25%', bottom: '-5px', delay: '0.2s', duration: '1.5s', size: '6px' },
            { left: '40%', bottom: '-15px', delay: '0.4s', duration: '2s', size: '8px' },
            { left: '55%', bottom: '-10px', delay: '0.1s', duration: '1.2s', size: '5px' },
            { left: '70%', bottom: '-5px', delay: '0.5s', duration: '1.8s', size: '7px' },
            { left: '85%', bottom: '-15px', delay: '0.3s', duration: '1.4s', size: '6px' },
            { left: '15%', bottom: '-8px', delay: '0.6s', duration: '1.7s', size: '5px' },
            { left: '65%', bottom: '-12px', delay: '0.7s', duration: '1.3s', size: '9px' }
        ];

        const FlatBeaker = ({ 
            currentTemp, 
            color, 
            isReacting, 
            particlesType, 
            showThermometer = true, 
            liquidHeight = '50%', 
            label, 
            isDraggable = false,
            isHidden = false,
            customClass = ''
        }) => {
            const tempPercent = typeof currentTemp === 'number' 
                ? Math.min(Math.max((currentTemp / 70) * 100, 0), 100) 
                : 0;

            if (isHidden) return <div className="w-[140px] h-[170px]"></div>;

            return (
                <div className={`relative flex flex-col items-center w-[140px] ${customClass}`}>
                    {label && (
                        <div className="absolute -bottom-14 left-1/2 -translate-x-1/2 whitespace-nowrap bg-white/95 text-black px-3 py-1 rounded-md border-[3px] border-black text-xs font-bold z-50 shadow-md">
                            {label}
                        </div>
                    )}

                    {showThermometer && typeof currentTemp === 'number' && (
                        <div className="absolute top-[10px] left-[-35px] bg-black text-white px-2 py-1 rounded-md text-xs font-mono font-bold z-50">
                            {currentTemp.toFixed(1)}°C
                        </div>
                    )}

                    <div className="relative mt-2">
                        <div className="absolute top-[-6px] left-[-10px] right-[-10px] h-[12px] bg-white border-[6px] border-black rounded-full z-40"></div>
                        
                        <div className="w-[120px] h-[150px] bg-white border-[6px] border-t-0 border-black rounded-b-[24px] relative overflow-hidden z-10 flex flex-col justify-end">
                            <div 
                                className="liquid-layer w-full relative transition-all duration-1000 ease-in-out origin-bottom border-t-[4px] border-black"
                                style={{ height: liquidHeight, backgroundColor: color }}
                            >
                                {isReacting && particlesType === 'fire' && (
                                    <div className="absolute inset-0 flex justify-center items-end pb-2 opacity-80">
                                        <div className="w-full h-full flex justify-around animate-pulse">
                                            {[...Array(6)].map((_, i) => (
                                                <div key={`fire-${i}`} className="w-2 h-2 bg-red-500 rounded-full animate-ping" style={{ animationDelay: `${i*0.2}s`, animationDuration: '0.8s'}}></div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                {isReacting && particlesType === 'snow' && (
                                    <div className="absolute inset-0 opacity-80">
                                        {PARTICLES_DATA.map((p, i) => (
                                            <div key={`snow-${i}`} className="absolute bg-white border-[2px] border-blue-200 rounded-full animate-bounce" 
                                                style={{ left: p.left, bottom: p.bottom, width: p.size, height: p.size, animationDelay: p.delay, animationDuration: p.duration }}>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                {isReacting && particlesType === 'bubbles' && (
                                    <div className="absolute inset-0 opacity-80">
                                        {PARTICLES_DATA.map((p, i) => (
                                            <div key={`bubble-${i}`} className="absolute border-[2px] border-black/30 rounded-full" 
                                                style={{ left: p.left, bottom: p.bottom, width: p.size, height: p.size, animation: `floatUp ${p.duration} linear infinite`, animationDelay: p.delay }}>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="absolute top-[10px] bottom-[15px] left-0 flex flex-col justify-between py-1 pointer-events-none z-30">
                                {[...Array(6)].map((_, i) => (
                                    <div key={`tick-${i}`} className={`h-[4px] bg-black ${i % 2 === 0 ? 'w-[20px]' : 'w-[12px]'}`}></div>
                                ))}
                            </div>
                        </div>

                        {showThermometer && (
                            <div className="absolute bottom-[25px] right-[15px] w-[20px] h-[170px] bg-white border-[5px] border-black rounded-full p-[2px] flex flex-col justify-end z-20">
                                <div className="w-full bg-red-600 rounded-full transition-all duration-300 origin-bottom" style={{ height: `${tempPercent}%` }}></div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const TemperatureGraph = ({ data, maxTime, type }) => {
            if (!data || data.length === 0) return (
                <div className="w-full h-full min-h-[150px] bg-slate-900/50 rounded-2xl flex items-center justify-center text-slate-500 border border-slate-700/50">
                    <span>รอข้อมูลอุณหภูมิ...</span>
                </div>
            );

            const w = 400, h = 180, margin = 35;
            const isExo = type === 'exothermic';
            const maxT = 70; 
            
            const getX = (time) => margin + (time / maxTime) * (w - margin * 2 + 10);
            const getY = (temp) => h - margin - (temp / maxT) * (h - margin * 2);

            const pathData = `M ${getX(data[0].time)},${getY(data[0].temp)} ` + 
                            data.map(d => `L ${getX(d.time)},${getY(d.temp)}`).join(' ');

            return (
                <div className="relative w-full h-full min-h-[180px] bg-slate-900 rounded-2xl p-4 border border-slate-700 flex flex-col">
                    <div className="flex-1 relative w-full h-full">
                        <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-full overflow-visible">
                            <line x1={margin} y1={getY(25)} x2={w-margin+10} y2={getY(25)} stroke="#334155" strokeDasharray="2" opacity="0.5"/>
                            <line x1={margin} y1={getY(50)} x2={w-margin+10} y2={getY(50)} stroke="#334155" strokeDasharray="2" opacity="0.5"/>
                            <line x1={margin} y1={h-margin} x2={w-margin+20} y2={h-margin} stroke="#64748b" strokeWidth="2" />
                            <line x1={margin} y1={h-margin} x2={margin} y2={margin-10} stroke="#64748b" strokeWidth="2" />
                            
                            <text x={margin-5} y={getY(25)+4} fill="#64748b" fontSize="10" textAnchor="end">25°</text>
                            <text x={margin-5} y={getY(50)+4} fill="#64748b" fontSize="10" textAnchor="end">50°</text>
                            <text x={margin-15} y={margin-15} fill="#94a3b8" fontSize="10" fontWeight="bold">T(°C)</text>
                            <text x={w-15} y={h-10} fill="#94a3b8" fontSize="10" fontWeight="bold">เวลา</text>

                            <path d={pathData} fill="none" stroke={isExo ? "#ef4444" : "#3b82f6"} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
                            {data.length > 0 && (
                                <circle cx={getX(data[data.length-1].time)} cy={getY(data[data.length-1].temp)} r="4" fill={isExo ? "#fca5a5" : "#93c5fd"} />
                            )}
                        </svg>
                    </div>
                </div>
            );
        }

        const EnergyGraph = ({ energyProfile, type }) => {
            if (!energyProfile) return (
                <div className="w-full h-full min-h-[150px] bg-slate-900/50 rounded-2xl flex items-center justify-center text-slate-500 border border-slate-700/50">
                    <span>รอผลเพื่อแสดงกราฟ...</span>
                </div>
            );

            const { reactants, activation, products } = energyProfile;
            const isExo = type === 'exothermic';
            const w = 400, h = 200, margin = 30;
            
            const getX = (p) => margin + (p / 100) * (w - margin * 2);
            const getY = (v) => h - margin - (v / 100) * (h - margin * 2);

            const pathData = `M ${getX(10)},${getY(reactants)} L ${getX(30)},${getY(reactants)} 
                            Q ${getX(40)},${getY(reactants)} ${getX(50)},${getY(activation)}
                            Q ${getX(60)},${getY(products)} ${getX(70)},${getY(products)} L ${getX(90)},${getY(products)}`;

            return (
                <div className="relative w-full h-full min-h-[200px] bg-slate-900 rounded-2xl p-4 border border-slate-700">
                    <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-full overflow-visible">
                        <line x1={margin} y1={h-margin} x2={w-margin+10} y2={h-margin} stroke="#64748b" strokeWidth="2" />
                        <line x1={margin} y1={h-margin} x2={margin} y2={margin-10} stroke="#64748b" strokeWidth="2" />
                        <text x={margin-5} y={margin-5} fill="#94a3b8" fontSize="10" fontWeight="bold">พลังงาน</text>
                        <text x={w-50} y={h-10} fill="#94a3b8" fontSize="10" fontWeight="bold">การดำเนินไป</text>

                        <path d={pathData} fill="none" stroke={isExo ? "#ef4444" : "#3b82f6"} strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
                        
                        <text x={getX(10)} y={getY(reactants)-10} fill="#f1f5f9" fontSize="10" fontWeight="bold">สารตั้งต้น</text>
                        <text x={getX(70)} y={getY(products)-10} fill="#f1f5f9" fontSize="10" fontWeight="bold">ผลิตภัณฑ์</text>
                    </svg>
                </div>
            );
        }

        function InteractiveLab() {
            const [activeExp, setActiveExp] = useState(null);
            const [expState, setExpState] = useState('IDLE');
            const [currentTemp, setCurrentTemp] = useState(25);
            const [currentColor, setCurrentColor] = useState('#fff');
            const [tempHistory, setTempHistory] = useState([]);
            const [isDragOver, setIsDragOver] = useState(false);
            
            const animationRef = useRef(null);

            const selectExperiment = (exp) => {
                if (expState === 'POURING' || expState === 'REACTING') return;
                setActiveExp(exp);
                setCurrentTemp(exp.baseTemp);
                setCurrentColor(exp.baseColor); 
                setExpState('READY');
                setTempHistory([]); 
                setIsDragOver(false);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragOver(false);
                if (expState === 'READY') {
                    runSequence();
                }
            };

            const runSequence = () => {
                if (!activeExp || expState !== 'READY') return;
                setExpState('POURING');
                setTimeout(() => {
                    setExpState('REACTING');
                    startReaction();
                }, 1500); 
            };

            const startReaction = () => {
                if (!activeExp) return;
                
                setCurrentColor(activeExp.finalColor);
                const startT = activeExp.baseTemp;
                const endT = activeExp.targetTemp;
                const duration = activeExp.reactionTime;
                const startObj = { time: 0, temp: startT };
                
                setTempHistory([startObj]);
                let history = [startObj];
                let startTime = Date.now();
                let lastUpdate = startTime;

                const animateTemp = () => {
                    const now = Date.now();
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    
                    const newTemp = startT + (endT - startT) * progress; 
                    setCurrentTemp(newTemp);
                    
                    if (now - lastUpdate > 100 || progress === 1) {
                        history.push({ time: elapsed / 1000, temp: newTemp });
                        setTempHistory([...history]);
                        lastUpdate = now;
                    }

                    if (progress < 1) {
                        animationRef.current = requestAnimationFrame(animateTemp);
                    } else {
                        setExpState('FINISHED');
                    }
                };
                animationRef.current = requestAnimationFrame(animateTemp);
            };

            useEffect(() => {
                return () => { 
                    if (animationRef.current) cancelAnimationFrame(animationRef.current); 
                };
            }, []);

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-6 font-sans flex flex-col">
                    <div className="w-full max-w-[1800px] mx-auto flex-1 flex flex-col gap-6">
                        
                        {/* Top Bar - Scrollable on mobile */}
                        <header className="flex flex-col xl:flex-row justify-between items-center gap-4 bg-slate-900 p-4 rounded-2xl border border-slate-800 overflow-hidden">
                            <div className="flex items-center gap-3 w-full xl:w-auto flex-shrink-0">
                                <div className="p-2 bg-indigo-500 rounded-lg flex-shrink-0">
                                    <svg className="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg>
                                </div>
                                <h1 className="text-lg md:text-xl font-bold text-white truncate">Interactive Board: พลังงานเคมี</h1>
                            </div>
                            <div className="flex overflow-x-auto w-full gap-2 pb-2 snap-x hide-scroll">
                                {EXPERIMENTS.map(exp => (
                                    <button 
                                        key={exp.id} 
                                        onClick={() => selectExperiment(exp)} 
                                        disabled={expState === 'POURING' || expState === 'REACTING'}
                                        className={`whitespace-nowrap flex-shrink-0 snap-start px-4 py-2 rounded-xl text-sm font-medium transition-all ${
                                            activeExp?.id === exp.id 
                                                ? (exp.type === 'exothermic' ? 'bg-red-500/20 text-red-400 border border-red-500' : 'bg-blue-500/20 text-blue-400 border border-blue-500') 
                                                : 'bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700'
                                        } ${expState === 'POURING' || expState === 'REACTING' ? 'opacity-50 cursor-not-allowed' : ''}`}>
                                        {exp.name}
                                    </button>
                                ))}
                            </div>
                        </header>

                        {/* Split Panels */}
                        <div className="flex-1 flex flex-col lg:flex-row gap-6">
                            
                            {/* Left: Simulation Area */}
                            <div className="lg:w-1/2 bg-slate-900 rounded-2xl border border-slate-800 p-6 flex flex-col relative min-h-[550px] lg:min-h-full overflow-hidden">
                                <h2 className="text-lg font-bold text-slate-200 mb-4 border-b border-slate-800 pb-2 z-20 relative">พื้นที่ทดลอง (Drag & Drop)</h2>
                                
                                {!activeExp ? (
                                    <div className="flex-1 flex items-center justify-center text-slate-500 text-sm border-2 border-dashed border-slate-800 rounded-xl">
                                        เลือกปฏิกิริยาด้านบนเพื่อเริ่มการทดลอง
                                    </div>
                                ) : (
                                    <div className="flex-1 flex flex-col relative w-full h-full justify-end">
                                        <div className="absolute inset-0 border-2 border-slate-600/50 border-dashed rounded-xl pointer-events-none z-0 overflow-hidden bg-slate-900/30">
                                            <div className="absolute top-3 left-4 text-slate-300 font-bold text-sm flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-600/50 shadow-sm z-10">
                                                🌍 สิ่งแวดล้อม (Environment)
                                            </div>
                                            
                                            {expState === 'REACTING' && activeExp && (
                                                <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
                                                    {activeExp.type === 'exothermic' ? (
                                                        <React.Fragment>
                                                            <div className="absolute text-red-500 font-bold text-3xl md:text-4xl animate-heat-out-up top-16 left-[5%]">↖</div>
                                                            <div className="absolute text-red-500 font-bold text-3xl md:text-4xl animate-heat-out-up top-16 right-[5%]">↗</div>
                                                            <div className="absolute text-red-500 font-bold text-3xl md:text-4xl animate-heat-out-left top-[40%] left-[2%]">←</div>
                                                            <div className="absolute text-red-500 font-bold text-3xl md:text-4xl animate-heat-out-right top-[40%] right-[2%]">→</div>
                                                            <div className="absolute top-12 text-red-400 font-bold text-sm bg-red-950/90 px-4 py-2 rounded-full border border-red-500/50 shadow-[0_0_15px_rgba(248,113,113,0.3)] animate-pulse">
                                                                🔥 ถ่ายเทความร้อนออกสู่สิ่งแวดล้อม
                                                            </div>
                                                        </React.Fragment>
                                                    ) : (
                                                        <React.Fragment>
                                                            <div className="absolute text-blue-400 font-bold text-3xl md:text-4xl animate-heat-in-down top-16 left-[5%]">↘</div>
                                                            <div className="absolute text-blue-400 font-bold text-3xl md:text-4xl animate-heat-in-down top-16 right-[5%]">↙</div>
                                                            <div className="absolute text-blue-400 font-bold text-3xl md:text-4xl animate-heat-in-right top-[40%] left-[2%]">→</div>
                                                            <div className="absolute text-blue-400 font-bold text-3xl md:text-4xl animate-heat-in-left top-[40%] right-[2%]">←</div>
                                                            <div className="absolute top-12 text-blue-400 font-bold text-sm bg-blue-950/90 px-4 py-2 rounded-full border border-blue-500/50 shadow-[0_0_15px_rgba(96,165,250,0.3)] animate-pulse">
                                                                ❄️ ดูดความร้อนจากสิ่งแวดล้อมเข้าสู่ระบบ
                                                            </div>
                                                        </React.Fragment>
                                                    )}
                                                </div>
                                            )}
                                        </div>

                                        <div className="flex justify-center items-end gap-[40px] md:gap-[80px] w-full relative z-10 pb-20 scale-[0.85] md:scale-100 origin-bottom mt-auto">
                                            
                                            <div 
                                                className={`transition-all relative flex flex-col items-center ${isDragOver ? 'scale-105 opacity-80' : ''}`}
                                                onDragOver={(e) => { e.preventDefault(); if(expState==='READY') setIsDragOver(true); }}
                                                onDragLeave={() => setIsDragOver(false)}
                                                onDrop={handleDrop}
                                            >
                                                <FlatBeaker 
                                                    currentTemp={currentTemp} 
                                                    color={currentColor} 
                                                    isReacting={expState === 'REACTING'}
                                                    particlesType={activeExp?.particles}
                                                    showThermometer={true}
                                                    liquidHeight={['IDLE','READY'].includes(expState) ? '40%' : '80%'}
                                                    label={activeExp.baseReactant}
                                                />
                                            </div>

                                            <div className="relative flex flex-col items-center">
                                                <div 
                                                    draggable={expState === 'READY'}
                                                    onDragStart={(e) => { e.dataTransfer.setData('text/plain', 'source'); }}
                                                    className={`${expState !== 'READY' ? 'opacity-0 pointer-events-none' : 'hover:scale-105 transition-transform cursor-grab active:cursor-grabbing'}`}
                                                >
                                                    <FlatBeaker 
                                                        color={activeExp.addedColor} 
                                                        showThermometer={false}
                                                        liquidHeight="40%"
                                                        label={activeExp.addedReactant}
                                                        isDraggable={true}
                                                    />
                                                </div>

                                                {expState === 'POURING' && (
                                                    <div className="absolute bottom-0 left-0 pointer-events-none animate-pour-from-right z-50 origin-bottom-left">
                                                        <FlatBeaker 
                                                            color={activeExp.addedColor} 
                                                            showThermometer={false}
                                                            liquidHeight="40%" 
                                                            label={activeExp.addedReactant}
                                                            customClass="pour-inner"
                                                        />
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        <div className="text-center h-[50px] relative z-20 mt-4 flex justify-center items-center">
                                            {expState === 'READY' && <button onClick={runSequence} className="px-6 py-2 bg-emerald-500 hover:bg-emerald-400 text-white rounded-lg font-bold shadow-lg md:hidden">แตะเพื่อผสมสาร (มือถือ)</button>}
                                            {(expState === 'POURING' || expState === 'REACTING') && <p className="text-amber-400 font-bold animate-pulse text-lg">กำลังทำปฏิกิริยา...</p>}
                                            {expState === 'FINISHED' && (
                                                <p className={`font-bold text-lg ${activeExp.type === 'exothermic' ? 'text-red-400' : 'text-blue-400'}`}>
                                                    การทดลองเสร็จสิ้น! อุณหภูมิสุดท้าย: {activeExp.targetTemp}°C
                                                </p>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Right: Analysis Pro Panel */}
                            <div className="lg:w-1/2 flex flex-col gap-4">
                                <div className="bg-slate-900 rounded-2xl border border-slate-800 p-5">
                                    <h3 className="font-bold text-slate-200 mb-2">วิเคราะห์ปฏิกิริยาเคมี</h3>
                                    {activeExp && expState === 'FINISHED' ? (
                                        <div className="space-y-3 animate-in fade-in zoom-in duration-500">
                                            <div className={`p-3 rounded-xl border ${activeExp.type === 'exothermic' ? 'bg-red-500/10 border-red-500/30' : 'bg-blue-500/10 border-blue-500/30'}`}>
                                                <p className={`font-bold ${activeExp.type === 'exothermic' ? 'text-red-400' : 'text-blue-400'}`}>{activeExp.title}</p>
                                                <p className="text-sm text-slate-300 mt-1">{activeExp.description}</p>
                                            </div>
                                            <code className="block bg-slate-950 p-3 rounded-lg text-emerald-400 text-sm md:text-base font-mono break-words border border-slate-800 text-center">
                                                {activeExp.equation.split('ความร้อน').map((part, i, arr) => (
                                                <React.Fragment key={i}>
                                                    {part}
                                                    {i < arr.length - 1 && <span className="text-yellow-400 font-bold px-1">ความร้อน</span>}
                                                </React.Fragment>
                                                ))}
                                            </code>
                                        </div>
                                    ) : (
                                        <p className="text-sm text-slate-500">รอผลการทดลอง...</p>
                                    )}
                                </div>

                                <div className="grid grid-cols-1 xl:grid-cols-2 gap-4 flex-1">
                                    <div className="bg-slate-900 rounded-2xl border border-slate-800 p-4 flex flex-col min-h-[250px]">
                                        <h3 className="text-sm font-bold text-slate-300 mb-1">กราฟอุณหภูมิต่อเวลา</h3>
                                        <p className="text-xs text-slate-400 mb-3 min-h-[32px]">
                                            {activeExp && expState !== 'IDLE' 
                                                ? (activeExp.type === 'exothermic' ? '🌡️ อุณหภูมิระบบสูงขึ้น เนื่องจากมีการคายความร้อนออกสู่สิ่งแวดล้อม' : '❄️ อุณหภูมิระบบลดลง เนื่องจากระบบดูดความร้อนจากสิ่งแวดล้อมเข้าไป')
                                                : 'แสดงการเปลี่ยนแปลงอุณหภูมิเมื่อเวลาผ่านไป'}
                                        </p>
                                        <div className="flex-1">
                                            <TemperatureGraph data={tempHistory} maxTime={activeExp ? activeExp.reactionTime/1000 : 1} type={activeExp?.type} />
                                        </div>
                                    </div>
                                    
                                    <div className="bg-slate-900 rounded-2xl border border-slate-800 p-4 flex flex-col min-h-[250px]">
                                        <h3 className="text-sm font-bold text-slate-300 mb-1">กราฟพลังงาน (Energy Profile)</h3>
                                        <p className="text-xs text-slate-400 mb-3 min-h-[32px]">
                                            {activeExp && expState === 'FINISHED'
                                                ? (activeExp.type === 'exothermic' ? '📉 พลังงานผลิตภัณฑ์ < สารตั้งต้น (ส่วนต่างถูกคายออก)' : '📈 พลังงานผลิตภัณฑ์ > สารตั้งต้น (ดูดพลังงานเข้าไปสะสมเพิ่ม)')
                                                : 'แสดงระดับพลังงานของสารในระบบ'}
                                        </p>
                                        <div className="flex-1">
                                            <EnergyGraph energyProfile={expState === 'FINISHED' ? activeExp?.energyProfile : null} type={activeExp?.type} />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<InteractiveLab />);
    </script>
</body>
</html>
